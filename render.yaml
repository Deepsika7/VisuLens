# Render Blueprint for VisuLens (AI Visual Search Engine)
# This file automates the deployment of both Frontend (Static) and Backend (Docker Web Service)

services:
  # 1. Backend Service: Flask + ResNet50 (Python Docker)
  - type: web
    name: visulens-backend
    env: docker
    plan: free
    region: oregon 
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    # Render assigns dynamic ports; Flask is set to listen on the PORT env var
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATASET_PATH
        value: dataset
      - key: EMBEDDINGS_PATH
        value: embeddings.pkl
    # NOTE: Disk has been removed to maintain FREE tier eligibility.

  # 2. Frontend Service: Vite + React (Static Site)
  - type: web
    name: visulens-frontend
    env: static
    # Point Render to build from the root via the root package.json script
    buildCommand: cd frontend && npm install && npm run build
    # Directory to publish
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        # Hardcoding the URL to ensure it resolves correctly during the Vite build process
        value: https://visulens-backend-vj4o.onrender.com
